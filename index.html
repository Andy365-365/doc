<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>技术文档翻译合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
.header h1{font-size:1rem;color:#58a6ff;white-space:nowrap}
.back-btn{display:none;padding:4px 12px;background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:0.85rem;white-space:nowrap}
.back-btn:hover{background:#30363d}

/* Layout */
.container{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:320px;min-width:320px;border-right:1px solid #21262d;display:flex;flex-direction:column;background:#0d1117;overflow:hidden}
.sidebar-header{padding:12px 16px;border-bottom:1px solid #21262d}
.sidebar-header .count{color:#8b949e;font-size:0.8rem}
.search-box{padding:8px 12px;border-bottom:1px solid #21262d}
.search-box input{width:100%;padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:0.85rem;outline:none}
.search-box input:focus{border-color:#58a6ff}
.article-list{flex:1;overflow-y:auto}
.article-item{display:flex;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid #21262d;transition:background 0.15s}
.article-item:hover{background:#161b22}
.article-item.active{background:#161b22;border-left:3px solid #58a6ff}
.article-item .title{flex:1;font-size:0.85rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.article-item .ver{color:#8b949e;font-size:0.75rem;margin-left:8px;flex-shrink:0}

/* Main content */
.main{flex:1;display:flex;align-direction:column;overflow:hidden}
.welcome{display:flex;align-items:center;justify-content:center;flex:1;color:#8b949e;font-size:1rem}
iframe{flex:1;border:none;background:#fff;width:100%;height:100%}

/* Scrollbar */
.article-list::-webkit-scrollbar{width:6px}
.article-list::-webkit-scrollbar-track{background:#0d1117}
.article-list::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

/* Responsive */
@media(max-width:768px){
  .sidebar{width:260px;min-width:260px}
}
</style>
</head>
<body>

<div class="header">
  <h1>技术文档翻译合集</h1>
  <button class="back-btn" onclick="goBack()">&#8592; 返回列表</button>
</div>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="count">共 27 篇文章</span>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="搜索文章..." oninput="filterArticles()">
    </div>
    <div class="article-list" id="articleList"></div>
  </div>
  <div class="main" id="mainContent">
    <div class="welcome">从左侧选择一篇文章</div>
  </div>

u7684\u8e29\u5751\u5168\u8bb0\u5f55", "\u5927\u6a21\u578bRAG\u5b9e\u6218\uff0c\u4ece\u88ab\u9a82\u4e0d\u9760\u8c31\u5230\u6210\u4e3a\u90e8\u95e8MVP\uff0c\u8fd9\u662f\u6211\u7684\u8e29\u5751\u5168\u8bb0\u5f55_v1.1.html", "1.1"], ["\u5927\u6a21\u578b\u5782\u76f4\u9886\u57df\u5fae\u8c03\u7cfb\u5217\uff08\u4e00\uff09\uff1a\u8ba4\u8bc6\u5fae\u8c03", "\u5927\u6a21\u578b\u5782\u76f4\u9886\u57df\u5fae\u8c03\u7cfb\u5217\uff08\u4e00\uff09\uff1a\u8ba4\u8bc6\u5fae\u8c03_v1.7.html", "1.7"], ["\u5927\u6a21\u578b\u5782\u76f4\u9886\u57df\u5fae\u8c03\u7cfb\u5217\uff08\u4e09\uff09\uff1a\u5b8c\u6574\u5b9e\u6218\u4e0e\u6700\u4f73\u5b9e\u8df5", "\u5927\u6a21\u578b\u5782\u76f4\u9886\u57df\u5fae\u8c03\u7cfb\u5217\uff08\u4e09\uff09\uff1a\u5b8c\u6574\u5b9e\u6218\u4e0e\u6700\u4f73\u5b9e\u8df5_v1.7.html", "1.7"], ["\u5927\u6a21\u578b\u5782\u76f4\u9886\u57df\u5fae\u8c03\u7cfb\u5217\uff08\u4e8c\uff09\uff1ams-swift \u6846\u67b6\u5168\u666f", "\u5927\u6a21\u578b\u5782\u76f4\u9886\u57df\u5fae\u8c03\u7cfb\u5217\uff08\u4e8c\uff09\uff1ams-swift \u6846\u67b6\u5168\u666f_v1.7.html", "1.7"], ["\u5982\u4f55\u7f16\u5199\u9ad8\u8d28\u91cf\u7684agent skill\uff1f", "\u5982\u4f55\u7f16\u5199\u9ad8\u8d28\u91cf\u7684agent skill\uff1f_v6.21.html", "6.21"], ["\u901a\u8fc7\u793a\u4f8b\u7406\u89e3\u7433\u746f\u6ee1\u76ee\u7684\u57fa\u51c6\u6d4b\u8bd5", "\u901a\u8fc7\u793a\u4f8b\u7406\u89e3\u7433\u746f\u6ee1\u76ee\u7684\u57fa\u51c6\u6d4b\u8bd5_v6.21.html", "6.21"]];

let currentArticle = null;

function init() {
  const list = document.getElementById('articleList');
  articles.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'article-item';
    div.dataset.index = i;
    div.innerHTML = '<span class="title">' + a[0] + '</span>' + (a[2] ? '<span class="ver">' + a[2] + '</span>' : '');
    div.onclick = () => openArticle(i);
    list.appendChild(div);
  });

  // Check URL hash
  const hash = window.location.hash.slice(1);
  if (hash) {
    const idx = articles.findIndex(a => a[1] === decodeURIComponent(hash));
    if (idx >= 0) openArticle(idx);
  }
}

function openArticle(idx) {
  const a = articles[idx];
  currentArticle = idx;

  // Update URL
  window.location.hash = encodeURIComponent(a[1]);

  // Highlight active
  document.querySelectorAll('.article-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // Show iframe
  const main = document.getElementById('mainContent');
  main.innerHTML = '<iframe src="' + a[1] + '" sandbox="allow-same-origin allow-scripts"></iframe>';

  // Show back button
  document.querySelector('.back-btn').style.display = 'block';
}

function goBack() {
  currentArticle = null;
  window.location.hash = '';
  document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
  document.getElementById('mainContent').innerHTML = '<div class="welcome">从左侧选择一篇文章</div>';
  document.querySelector('.back-btn').style.display = 'none';
}

function filterArticles() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.article-item').forEach(el => {
    const title = el.querySelector('.title').textContent.toLowerCase();
    el.style.display = title.includes(q) ? '' : 'none';
  });
}

// Handle back/forward
window.addEventListener('hashchange', () => {
  const hash = window.location.hash.slice(1);
  if (!hash) { goBack(); return; }
  const idx = articles.findIndex(a => a[1] === decodeURIComponent(hash));
  if (idx >= 0) openArticle(idx);
});

init();
</script>
</body>
